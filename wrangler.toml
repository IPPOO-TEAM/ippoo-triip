# Cloudflare Pages — configuration projet.
# Le déploiement via intégration Git (GitHub → Pages) n'exécute PAS wrangler
# automatiquement : Pages lit juste le build output du dossier ci-dessous.
name = "ippoo-triip"
compatibility_date = "2026-09-02"

# Configuration assets pour Cloudflare Workers Builds / Pages
pages_build_output_dir = "dist"

[assets]
directory = "./dist"
